<svg xmlns="http://www.w3.org/2000/svg" width="960" height="206" viewBox="0 0 960 206"><rect width="960" height="206" fill="transparent"/><text x="32" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93A3B5">CAPABILITIES</text><line x1="32" y1="48" x2="928" y2="48" stroke="#263442"/><g transform="translate(32,68)"><rect width="42" height="42" rx="12" fill="#FF5A67" opacity=".14"/><path d="M13 14h6v-4M29 14h-6v-4M13 28h6v4M29 28h-6v4M15 14h12v14H15z" stroke="#F4F7FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="32" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" fill="#F4F7FA">PLUGIN SYSTEMS</text><text x="32" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93A3B5">Custom plugins, hooks, media,</text><text x="32" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93A3B5">data flows and migrations.</text><line x1="247" y1="69" x2="247" y2="177" stroke="#263442"/><g transform="translate(264,68)"><rect width="42" height="42" rx="12" fill="#31A7D0" opacity=".14"/><rect x="11" y="11" width="20" height="20" rx="3" stroke="#F4F7FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 17h20M18 17v14" stroke="#F4F7FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="264" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" fill="#F4F7FA">ELEMENTOR UX</text><text x="264" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93A3B5">Widgets, controls, contextual</text><text x="264" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93A3B5">templates and editor lifecycle.</text><line x1="479" y1="69" x2="479" y2="177" stroke="#263442"/><g transform="translate(496,68)"><rect width="42" height="42" rx="12" fill="#8B7CFF" opacity=".14"/><path d="M14 16l-5 5 5 5M28 16l5 5-5 5M24 11l-6 20" stroke="#F4F7FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="496" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" fill="#F4F7FA">INTERACTIVE FRONTEND</text><text x="496" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93A3B5">JavaScript behavior, Three.js</text><text x="496" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93A3B5">and responsive interfaces.</text><line x1="711" y1="69" x2="711" y2="177" stroke="#263442"/><g transform="translate(728,68)"><rect width="42" height="42" rx="12" fill="#56C08A" opacity=".14"/><path d="M12 21l6 6 12-13" stroke="#F4F7FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="21" r="12" stroke="#F4F7FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="728" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" fill="#F4F7FA">INTEGRATION &amp; RELIABILITY</text><text x="728" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93A3B5">External flows, persistence,</text><text x="728" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93A3B5">testing and explicit limits.</text></svg>
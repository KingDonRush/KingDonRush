<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190">
  <rect width="960" height="190" fill="transparent"/>
  <text x="34" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#95A1AF">CAPABILITIES</text>
  <line x1="34" y1="55" x2="926" y2="55" stroke="#263241"/>
  <circle cx="38" cy="88" r="4" fill="#F04F61"/>
  <text x="52" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="750" fill="#F3F6F9">PLUGIN SYSTEMS</text>
  <text x="34" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#95A1AF">Custom plugins, hooks, media,</text>
  <text x="34" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#95A1AF">data flows and migrations.</text><line x1="246" y1="75" x2="246" y2="163" stroke="#263241"/>
  <circle cx="268" cy="88" r="4" fill="#309BC2"/>
  <text x="282" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="750" fill="#F3F6F9">ELEMENTOR UX</text>
  <text x="264" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#95A1AF">Widgets, controls, contextual</text>
  <text x="264" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#95A1AF">templates and editor lifecycle.</text><line x1="476" y1="75" x2="476" y2="163" stroke="#263241"/>
  <circle cx="498" cy="88" r="4" fill="#8B7CF6"/>
  <text x="512" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="750" fill="#F3F6F9">INTERACTIVE FRONTEND</text>
  <text x="494" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#95A1AF">JavaScript behavior, Three.js</text>
  <text x="494" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#95A1AF">and responsive interfaces.</text><line x1="706" y1="75" x2="706" y2="163" stroke="#263241"/>
  <circle cx="728" cy="88" r="4" fill="#4CB782"/>
  <text x="742" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="750" fill="#F3F6F9">INTEGRATION & RELIABILITY</text>
  <text x="724" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#95A1AF">External flows, persistence,</text>
  <text x="724" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#95A1AF">testing and explicit limits.</text></svg>